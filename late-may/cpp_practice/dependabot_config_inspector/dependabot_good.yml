# dependabot_good.yml — the GOOD fixture
#
# Every rule the lesson cares about is satisfied:
#   R1 — package-ecosystem: github-actions present (yes, one block)
#   R2 — schedule.interval is weekly (in {daily, weekly})
#   R3 — groups declared (actions group)
#   R4 — commit-message.prefix is "chore(deps)" (conventional)
#   R5 — open-pull-requests-limit is 5 (> 0)
#   R6 — labels declared (one label: "dependencies")

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
